CONFIG_PRINTK=y
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_RGB888=y
CONFIG_GPIO=y

# Default 1024 overflows: lv_chart_create() (Plot Display) needs more stack.
CONFIG_MAIN_STACK_SIZE=4096

# Double LTDC framebuffer avoids CPU/DMA SDRAM contention that lagged the touch cursor.
CONFIG_STM32_LTDC_FB_NUM=2

# VDB @65%: <100% avoids a driver fast path that locks the UI; sized to flush the chart in one pass.
CONFIG_LV_Z_VDB_ZEPHYR_REGION=y
CONFIG_LV_Z_VDB_ZEPHYR_REGION_NAME="SDRAM1"
CONFIG_LV_Z_VDB_SIZE=65
CONFIG_LV_Z_DOUBLE_VDB=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=1

# Reboot on panic instead of halt-forever, so the board self-recovers.
CONFIG_RESET_ON_FATAL_ERROR=y

# IWDG catches lockups that raise no CPU fault; configured/fed from src/watchdog.c.
CONFIG_WATCHDOG=y

# Lets watchdog_report_reset_cause() tell a normal boot from a watchdog/software reset.
CONFIG_HWINFO=y

# Default input priority (14) starved by the LVGL workqueue: Menu button unresponsive.
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=-1

CONFIG_LVGL=y

# Default 2KB LVGL heap makes every lv_obj_create() return NULL; 128KB of 256KB SRAM.
CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y

CONFIG_LV_USE_ASSERT_MEM_INTEGRITY=y
CONFIG_LV_USE_ASSERT_OBJ=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_INPUT=y
CONFIG_LV_USE_BUTTONMATRIX=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_USE_TABLE=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_USE_BAR=y

CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# Raw .bin output, needed to flash external QSPI at 0x90000000.
CONFIG_BUILD_OUTPUT_BIN=y

# Chain-loaded by boot_qspi without a core reset: stale MPU config faults on our .bss zeroing.
CONFIG_INIT_ARCH_HW_AT_BOOT=y

CONFIG_PICOLIBC_IO_FLOAT=y

CONFIG_ADC=y

CONFIG_SENSOR=y

# Async printk replaces a blocking UART hook that stalled LVGL clicks and ADC threads.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Internal flash driver for the ball game high score; the QSPI NOR (XIP-mapped) doesn't need it.
CONFIG_FLASH=y
CONFIG_FLASH_STM32_QSPI=n
CONFIG_PRINTK=y
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_RGB888=y
CONFIG_GPIO=y

# Default (1024) overflows: lv_chart_create() (Plot Display) uses more
# stack than the other screens.
CONFIG_MAIN_STACK_SIZE=4096

# Double LTDC framebuffer: avoids CPU/DMA SDRAM bandwidth contention that
# caused a laggy touch cursor on fast-refreshing screens.
CONFIG_STM32_LTDC_FB_NUM=2

# LVGL's rendering buffer (VDB) lives in SDRAM1. Size is 65% (not the
# default 10%, not 100%): must stay below 100% to avoid a driver fast path
# that locks up the UI after a few full-screen refreshes, and must be
# large enough to flush the Plot Display chart area in a single pass.
CONFIG_LV_Z_VDB_ZEPHYR_REGION=y
CONFIG_LV_Z_VDB_ZEPHYR_REGION_NAME="SDRAM1"
CONFIG_LV_Z_VDB_SIZE=65
CONFIG_LV_Z_DOUBLE_VDB=y

# ERR level only: driver INFO/DEBUG logs saturated the 1KB deferred buffer
# and dropped messages before it reached our own printk() output.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=1

# Reboots on any CPU fault/panic instead of Zephyr's default halt-forever
# handler, so the board recovers on its own.
CONFIG_RESET_ON_FATAL_ERROR=y

# Hardware watchdog (IWDG): catches lockups that don't raise a CPU fault
# (infinite loop, deadlock). Configured and fed from src/watchdog.c.
CONFIG_WATCHDOG=y

# Lets watchdog_report_reset_cause() (src/watchdog.c) tell a normal boot
# apart from a watchdog/software reset, logged to the Event Logs screen.
CONFIG_HWINFO=y

# Default input thread priority (14, lowest) got starved by the LVGL
# workqueue (0) on Plot Display, making the Menu button unresponsive.
# Raised to match the system workqueue (-1) that feeds it touch events.
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=-1

CONFIG_LVGL=y

# Default LVGL heap (2KB) is too small: lv_display_create()'s first malloc
# fails, and every lv_obj_create() afterward silently returns NULL. 128KB
# is a comfortable margin (256KB SRAM available on this chip).
CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y

CONFIG_LV_USE_ASSERT_MEM_INTEGRITY=y
CONFIG_LV_USE_ASSERT_OBJ=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_INPUT=y
CONFIG_LV_USE_BUTTONMATRIX=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_USE_TABLE=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_USE_BAR=y

# For Live Variables: LVGL heap and thread stack stats.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# For RTOS Tasks: live thread list (name, state, priority, stack).
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# Raw .bin output, needed to flash external QSPI at 0x90000000.
CONFIG_BUILD_OUTPUT_BIN=y

# stm32f7_dashboard is chain-loaded by boot_qspi without a core reset: without this,
# boot_qspi's stale MPU config faults on our own .bss zeroing, before
# main() and before the console is up (silent on UART).
CONFIG_INIT_ARCH_HW_AT_BOOT=y

CONFIG_PICOLIBC_IO_FLOAT=y

CONFIG_ADC=y

# For temperature.c: die_temp and VREFINT via the standard sensor API.
CONFIG_SENSOR=y

# Async printk() (src/async_printk.c): replaces Zephyr's blocking UART
# output hook, which stalled LVGL click handlers and ADC threads.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Internal flash driver, for the ball game high score (src/ball_game.c).
# QSPI NOR (the app's own flash, already XIP-mapped) doesn't need it.
CONFIG_FLASH=y
CONFIG_FLASH_STM32_QSPI=n
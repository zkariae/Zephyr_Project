CONFIG_PRINTK=y
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_RGB888=y
CONFIG_GPIO=y

# Defaut (1024) trop juste : lv_chart_create() (ecran Plot Display) consomme
# davantage de pile LVGL que labels/boutons/table, ce qui faisait deborder
# la pile de main (MPU FAULT stacking error au demarrage).
CONFIG_MAIN_STACK_SIZE=4096

# Double framebuffer LTDC (au lieu du defaut = 1 seul buffer) : evite que le
# CPU (flush LVGL) et le DMA du controleur LTDC (scan-out vers l'ecran) se
# disputent la bande passante SDRAM sur le meme buffer, ce qui causait un
# curseur tactile lent/bloque sur les ecrans a fort taux de rafraichissement
# (ex. RTOS Tasks, table redessinee chaque seconde). Cout : ~392 Ko de SDRAM
# supplementaires (SDRAM1 n'est utilisee qu'a ~5% actuellement).
CONFIG_STM32_LTDC_FB_NUM=2

# VDB (rendering buffer) LVGL loge en SDRAM (region "SDRAM1" deja exposee
# par le noeud sdram1 du board, reutilisee telle quelle - meme pool que
# les framebuffers LTDC ci-dessus, 8 Mo de marge). Par defaut LV_Z_VDB_
# SIZE=10 (10% de l'ecran) + un seul buffer : un lv_screen_load() invalide
# l'ecran entier, donc LVGL doit boucler ~10 fois sur (rendu -> flush ->
# attente) pour le couvrir, d'ou la lenteur ressentie au changement
# d'onglet.
#
# VDB_SIZE=50 (PAS 100) : display_stm32_ltdc.c a un chemin special quand
# le buffer flushe couvre l'ecran ENTIER en un seul appel (x=0,y=0,largeur/
# hauteur = ecran) - il pointe alors directement le registre LTDC dessus et
# bloque jusqu'au prochain VSYNC (stm32_ltdc_sync_frame()), au lieu de
# passer par le chemin normal "ecriture partielle" qui gere son propre
# swap avant/arriere via CONFIG_STM32_LTDC_FB_NUM=2 ci-dessus. Teste a
# VDB_SIZE=100 : un rafraichissement plein ecran matchait exactement ce
# chemin special, et son alternance a 4 buffers (2 VDB + 2 framebuffers
# internes du driver, au lieu de 2) a fini par bloquer l'UI apres quelques
# secondes d'usage. A 50%, un rafraichissement plein ecran necessite tou-
# jours >=2 passes, donc "hauteur flushee == hauteur ecran" n'est plus
# jamais vrai : le chemin special n'est plus jamais emprunte, tout passe
# par le chemin "ecriture partielle" deja fiable (evite aussi le tearing
# vu a VDB_SIZE=100+DOUBLE_VDB desactive : plus de swap synchronise VSYNC
# du tout sur le chemin rapide des la 2e frame plein ecran).
#
# DOUBLE_VDB sans risque ici : le chemin "ecriture partielle" ne touche
# jamais aux buffers VDB de LVGL (buf0/buf1) pour son swap avant/arriere,
# qui reste toujours borne a 2 buffers fixes internes au driver - pas de
# melange a 4 buffers possible.
#
# DIAGNOSTIC TEMPORAIRE (ecran Plot Display fige : courbe figee mais
# echelle de temps qui continue d'avancer) : la zone du graphique fait
# CHART_W x CHART_H = 380x190 = 72200 px (plot_display.c), soit plus que
# le budget VDB a 50% (65280 px sur un ecran 480x272). Chaque tick de 20ms
# forcait donc LVGL a decouper le flush de cette zone en 2 passes (171
# lignes puis 19 lignes, visible dans les logs [ltdc-dbg] : h=171 puis
# h=19). Teste a VDB_SIZE=65 (84864 px) pour que la zone tienne en une
# seule passe et isoler si ce decoupage systematique etait la cause du
# gel visuel - toujours tres en dessous des 100% necessaires pour
# reactiver le chemin plein-ecran a risque diagnostique plus haut.
CONFIG_LV_Z_VDB_ZEPHYR_REGION=y
CONFIG_LV_Z_VDB_ZEPHYR_REGION_NAME="SDRAM1"
CONFIG_LV_Z_VDB_SIZE=65
CONFIG_LV_Z_DOUBLE_VDB=y

# Log au niveau ERR seulement : assez pour recuperer les rapports de fault
# de Zephyr (arch/arm/core/cortex_m/fault.c utilise LOG_ERR), sans revenir
# au flot de logs INFO/DEBUG des drivers qui noyait tout sous des
# "--- N messages dropped ---" (buffer differe de 1 Ko sature avant meme
# le premier printk applicatif).
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=1

# Le bus fault non resolu dans lv_draw_dispatch_layer (voir commit
# "Activer temporairement les asserts memoire LVGL") laisse actuellement
# la carte plantee indefiniment : le handler de fatal error par defaut de
# Zephyr (arch_system_halt(), zephyr/kernel/fatal.c) coupe les
# interruptions et boucle a l'infini, sans redemarrage. Avec cette option,
# k_sys_fatal_error_handler() appelle sys_reboot(SYS_REBOOT_WARM) a la
# place - couvre tout fault CPU (HardFault/BusFault), stack overflow ou
# kernel panic/oops, pas seulement celui-ci. Un simple reset matériel :
# repasse par boot_qspi -> Projet1 comme un demarrage a froid normal.
CONFIG_RESET_ON_FATAL_ERROR=y

# Watchdog materiel (IWDG) : filet de securite complementaire a l'option
# ci-dessus, pour les blocages qui ne levent PAS de fault CPU (boucle
# infinie, deadlock, thread qui monopolise le CPU - meme famille que le
# bug de starvation du thread input plus bas). Le driver STM32 est active
# automatiquement des que le noeud &iwdg est actif dans l'overlay du
# board (DT_HAS_ST_STM32_WATCHDOG_ENABLED, cf.
# zephyr/drivers/watchdog/Kconfig.stm32). Configure et nourri depuis
# src/watchdog.c.
CONFIG_WATCHDOG=y

# Bouton Menu insensible sur l'ecran Plot Display (diagnostic : west attach +
# GDB + CONFIG_INPUT_EVENT_DUMP temporaire) : le sous-systeme Input
# (zephyr/subsys/input/input.c) traite les evenements dans un thread dedie
# ("input"), qui tourne par defaut a K_LOWEST_APPLICATION_THREAD_PRIO (14,
# la priorite la plus basse du systeme - CONFIG_NUM_PREEMPT_PRIORITIES=15).
# Le workqueue LVGL (CONFIG_LV_Z_LVGL_WORKQUEUE_PRIORITY=0) tourne a une
# priorite bien plus elevee ; sur Plot Display il se reveille en continu
# (redessin du chart toutes les 100ms) et reste donc quasiment toujours
# pret a s'executer, ce qui affame completement le thread "input" (14) -
# jamais assez de temps CPU pour vider sa file de 16 messages. Quand elle
# sature, le driver tactile (qui reporte depuis le system workqueue,
# priorite cooperative -1, cf input_report() dans input.c) jette
# silencieusement les nouveaux evenements au lieu d'attendre de la place -
# d'ou le bouton totalement insensible, uniquement sur cet ecran ou LVGL
# est occupe en continu.
#
# Fix : aligner la priorite du thread "input" sur celle du system
# workqueue (-1, cooperative) qui reporte les evenements - il passe ainsi
# devant le workqueue LVGL (0) et le thread ADC (5) des qu'un evenement est
# en attente, quelle que soit l'activite de rendu en cours.
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=-1

CONFIG_LVGL=y

# CONFIG_LV_Z_MEM_POOL_SYS_HEAP=y (choix actif ici) utilise
# CONFIG_LV_Z_MEM_POOL_SIZE comme veritable tas LVGL - PAS
# CONFIG_LV_MEM_SIZE_KILOBYTES, qui ne sert qu'a l'allocateur natif de LVGL
# (non utilise dans cette config). Le defaut de LV_Z_MEM_POOL_SIZE (2048
# octets, 2 Ko) fait echouer lv_display_create() des le tout premier malloc
# LVGL (avant meme la creation du 1er ecran applicatif) : lv_display_get_
# default() reste NULL en permanence, donc chaque lv_obj_create(NULL)
# ulterieur (alarm_screen, calculator_screen, launcher_screen) echoue
# silencieusement lui aussi et renvoie NULL - voir lv_obj_class.c:58-65.
# Aucun appelant (launcher.c/app_alarm.c/app_calculator.c) ne verifie ce
# retour, d'ou le plantage plus loin sur un pointeur d'objet jamais
# initialise. 256 Ko de SRAM principale + 64 Ko de DTCM disponibles sur ce
# chip (voir sram0 dans zephyr.dts) : 128 Ko pour LVGL est large.
CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y

# Diagnostic temporaire pour le BUS FAULT dans lv_draw_dispatch_layer
# (pointeur "next" corrompu dans la liste des draw_task). Ces asserts
# verifient l'integrite du tas LVGL et la validite des objets a chaque
# operation critique, pour faire planter au point de corruption exact
# au lieu de bien plus tard dans un rendu sans rapport. A retirer une
# fois la cause identifiee (ralentit sensiblement le rendu).
CONFIG_LV_USE_ASSERT_MEM_INTEGRITY=y
CONFIG_LV_USE_ASSERT_OBJ=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_INPUT=y
CONFIG_LV_USE_BUTTONMATRIX=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_USE_TABLE=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_USE_BAR=y

# Pour l'ecran Live Variables : stats reelles du tas LVGL (sys_heap) et de
# la stack du thread courant, exposees via lvgl_heap_stats() et
# k_thread_stack_space_get().
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Pour l'ecran RTOS Tasks : liste des threads Zephyr vivants (nom, etat,
# priorite, pile) via k_thread_foreach_unlocked() + k_thread_name_get() +
# k_thread_state_str().
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# Genere un .bin brut, necessaire pour programmer la QSPI externe a
# l'adresse 0x90000000 (voir boards/stm32f7508_dk.overlay)
CONFIG_BUILD_OUTPUT_BIN=y

# Projet1 est charge en chaine par boot_qspi (qui saute directement dans
# notre Reset_Handler sans reinitialiser le coeur). Sans cette option, le
# MPU garde la configuration laissee par boot_qspi (notamment sa region
# de garde de pile) au moment ou notre propre demarrage tente de mettre a
# zero .bss (arch_bss_zero -> memset), ce qui declenche un MemManage Fault
# tres tot, avant meme main() et avant l'init de la console (silence total
# sur l'UART). CONFIG_INIT_ARCH_HW_AT_BOOT force Zephyr a reinitialiser le
# MPU/NVIC/cache aux valeurs de reset au tout debut de z_arm_reset, avant
# z_prep_c/arch_bss_zero (voir zephyr/arch/arm/core/cortex_m/reset.S et
# scb.c:z_arm_init_arch_hw_at_boot) - c'est le mecanisme prevu par Zephyr
# pour une image chain-loadee par un bootloader (cf. modules/Kconfig.mcuboot
# qui l'implique automatiquement pour les images enfants de MCUboot).
CONFIG_INIT_ARCH_HW_AT_BOOT=y

CONFIG_PICOLIBC_IO_FLOAT=y

CONFIG_ADC=y

# Lecture des pot0..pot3 en DMA (adc_input.c) plutot que par sequence
# bloquante par thread : ADC1 (pot0) sur DMA2 Stream0/Channel0, ADC3
# (pot1/pot2/pot3, un seul scan multi-canal) sur DMA2 Stream1/Channel2 -
# voir les proprietes dmas des noeuds &adc1/&adc3 dans l'overlay.
CONFIG_ADC_STM32_DMA=y

# Le driver adc_stm32 exige que tout buffer passe a adc_read() soit en
# region non-cacheable des que CONFIG_ADC_STM32_DMA est actif (le DCACHE
# du Cortex-M7 ne fait pas de cache-maintenance automatique sur les
# transferts DMA) - section .nocache fournie par le linker, cf buffers
# __nocache dans adc_input.c.
CONFIG_NOCACHE_MEMORY=y

# Pour temperature.c : capteur de temperature interne (die_temp) et VREFINT
# (vref), exposes par Zephyr via l'API sensor standard plutot qu'un adc_read()
# manuel (voir zephyr/dts/arm/st/f7/stm32f7.dtsi et boards/stm32f7508_dk.overlay).
CONFIG_SENSOR=y

# printk() asynchrone (src/async_printk.c) : le hook par defaut de Zephyr
# (uart_console.c:console_out()) est bloquant, uart_poll_out() octet par
# octet. Beaucoup de printk() sont appeles depuis des handlers de clic
# LVGL (meme thread que le tactile/rendu) ou des threads ADC dedies, d'ou
# un ralentissement direct de la navigation/reactivite. On remplace ce
# hook par un buffer circulaire + emission par interruption UART.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y